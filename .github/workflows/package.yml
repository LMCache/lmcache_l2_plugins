name: Package

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Release runs are never cancelled by newer commits.
concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      project: ${{ steps.version.outputs.project }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine packaging pytest
      - name: Test version guards
        run: python -m pytest -q .github/tests
      - name: Set distribution identity
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT" == release ]]; then
            version=$(python .github/scripts/prepare_package.py --tag "$TAG")
            project=lmcache-l2-plugins
          else
            version=$(python .github/scripts/prepare_package.py \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")
            project=lmcache-l2-plugins
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel and source distribution
        env:
          PROJECT: ${{ steps.version.outputs.project }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash .github/scripts/verify_package.sh dist/*.whl "$PROJECT" "$VERSION"
          bash .github/scripts/verify_package.sh dist/*.tar.gz "$PROJECT" "$VERSION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: github.repository == 'LMCache/lmcache_l2_plugins' && github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/lmcache-l2-plugins
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish release to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          skip-existing: true

  verify-release:
    needs: [build, publish-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Download and test the published wheel
        env:
          PROJECT: ${{ needs.build.outputs.project }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          bash .github/scripts/download_published.sh "$PROJECT" "$VERSION"
          bash .github/scripts/verify_package.sh published/*.whl "$PROJECT" "$VERSION"

  publish-test:
    if: github.repository == 'LMCache/lmcache_l2_plugins' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lmcache-l2-plugins
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish development package to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-test:
    needs: [build, publish-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Download and test the published wheel
        env:
          PROJECT: ${{ needs.build.outputs.project }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          bash .github/scripts/download_published.sh "$PROJECT" "$VERSION" https://test.pypi.org/simple
          bash .github/scripts/verify_package.sh published/*.whl "$PROJECT" "$VERSION"
