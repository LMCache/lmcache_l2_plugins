name: Package

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    # 02:17 Asia/Shanghai every day (18:17 UTC).
    - cron: "17 18 * * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Release runs are never cancelled by newer commits.
concurrency:
  group: package-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      project: ${{ steps.version.outputs.project }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install build twine packaging pytest "setuptools>=77.0.3" wheel
      - name: Test packaging helpers
        run: python -m pytest -q .github/tests
      - name: Set distribution identity
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT" == release ]]; then
            version=$(python .github/scripts/prepare_package.py --tag "$TAG")
            project=lmcache-l2-plugins
          else
            version=$(python .github/scripts/prepare_package.py \
              --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT")
            project=lmcache-l2-plugins
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Test installed wheel and source distribution
        env:
          PROJECT: ${{ steps.version.outputs.project }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m build_support.verify_package dist/*.whl "$PROJECT" "$VERSION"
          python -m build_support.verify_package dist/*.tar.gz "$PROJECT" "$VERSION"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish (${{ github.event_name == 'release' && 'PyPI' || 'TestPyPI' }})
    if: >-
      github.repository == 'LMCache/lmcache_l2_plugins' &&
      (github.event_name == 'release' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || 'testpypi' }}
      url: ${{ github.event_name == 'release' && 'https://pypi.org/p/lmcache-l2-plugins' || 'https://test.pypi.org/p/lmcache-l2-plugins' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: true

  verify-published:
    name: Verify published package
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Download and test the published wheel
        env:
          INDEX_URL: ${{ github.event_name == 'release' && 'https://pypi.org/simple' || 'https://test.pypi.org/simple' }}
          PROJECT: ${{ needs.build.outputs.project }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          bash .github/scripts/download_published.sh "$PROJECT" "$VERSION" "$INDEX_URL"
          python -m build_support.verify_package published/*.whl "$PROJECT" "$VERSION"

  discover-e2e:
    name: Discover e2e plugins
    runs-on: ubuntu-24.04
    outputs:
      plugins: ${{ steps.plugins.outputs.plugins }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"
      - name: Discover declared plugins with e2e coverage
        id: plugins
        run: |
          plugins=$(python -m build_support.e2e)
          echo "plugins=$plugins" >> "$GITHUB_OUTPUT"

  l2-e2e:
    needs: [build, discover-e2e]
    if: needs.discover-e2e.outputs.plugins != '[]'
    name: L2 server e2e (${{ matrix.plugin }}, LMCache dev, CPU)
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover-e2e.outputs.plugins) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts/${{ matrix.plugin }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: false
          egress-policy: audit

      - name: Checkout tested revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The default checkout follows the event, including the release tag.
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Download this run's verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Install LMCache dev and plugin on the runner
        env:
          NO_GPU_EXT: "1"
          MAX_JOBS: "1"
          L2_PLUGIN: ${{ matrix.plugin }}
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          revision=$(git ls-remote https://github.com/LMCache/LMCache.git refs/heads/dev | cut -f1)
          test -n "$revision"
          echo "$revision" | tee "$E2E_ARTIFACTS/lmcache-revision.txt"
          git rev-parse HEAD > "$E2E_ARTIFACTS/plugins-revision.txt"
          python --version
          command -v git g++
          python -m pip install --upgrade pip uv
          uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
          git clone https://github.com/LMCache/LMCache.git "$RUNNER_TEMP/LMCache"
          git -C "$RUNNER_TEMP/LMCache" checkout "$revision"
          uv pip install --system -r "$RUNNER_TEMP/LMCache/requirements/build.txt"
          uv pip install --system --no-build-isolation "$RUNNER_TEMP/LMCache"
          python - <<'PYTHON'
          from pathlib import Path
          import os
          import subprocess
          from build_support.plugins import load_plugins
          plugin = next(p for p in load_plugins(Path.cwd()) if p.name == os.environ["L2_PLUGIN"])
          wheel = next(Path("dist").glob("*.whl")).resolve()
          subprocess.run(["uv", "pip", "install", "--system", f"{wheel}[{plugin.name},test]", "pytest-timeout", *plugin.test_dependencies], check=True)
          PYTHON
          sha256sum dist/*.whl > "$E2E_ARTIFACTS/plugin-wheel.sha256"
          uv pip freeze --system > "$E2E_ARTIFACTS/runtime-versions.txt"

      - name: Start L2 backend
        run: bash "e2e/${{ matrix.plugin }}/service.sh" start

      - name: Run real server round trip on the runner
        run: |
          if [[ -f "$E2E_ARTIFACTS/backend.env" ]]; then
            source "$E2E_ARTIFACTS/backend.env"
          fi
          # Run outside the checkout so imports resolve to the installed wheel.
          mkdir -p "$RUNNER_TEMP/l2-e2e"
          cp -R e2e "$RUNNER_TEMP/l2-e2e/"
          cd "$RUNNER_TEMP/l2-e2e"
          python - <<'PYTHON'
          from pathlib import Path
          import lmcache_l2_plugins
          location = Path(lmcache_l2_plugins.__file__).resolve()
          assert "site-packages" in location.parts, location
          print(f"Testing installed plugin: {location}")
          PYTHON
          bash e2e/common_scripts/run.sh "e2e/${{ matrix.plugin }}"

      - name: Collect backend logs
        if: always()
        run: bash "e2e/${{ matrix.plugin }}/service.sh" logs

      - name: Stop L2 backend
        if: always()
        run: bash "e2e/${{ matrix.plugin }}/service.sh" stop

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: l2-server-e2e-${{ matrix.plugin }}
          path: e2e-artifacts/${{ matrix.plugin }}/
