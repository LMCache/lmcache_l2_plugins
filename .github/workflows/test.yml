name: Tests

on:
  schedule:
    # 02:17 Asia/Shanghai every day (18:17 UTC).
    - cron: "17 18 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout tested revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Use the event revision: PR merge, nightly default branch, release tag,
          # or the branch/tag selected for manual dispatch.
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system torch \
            --index-url https://download.pytorch.org/whl/cpu
          NO_GPU_EXT=1 uv pip install --system -e ".[autumn,test]"

      - name: Run unit tests
        run: python -m pytest -q -rs tests

  autumn-e2e:
    name: Autumn server e2e (LMCache dev, CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: autumn-e2e
      COMPOSE_FILE: tests/e2e/compose.yaml
      E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: false
          egress-policy: audit

      - name: Checkout tested revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # The default checkout follows the event, including the release tag.
          persist-credentials: false

      - name: Resolve LMCache dev revision
        run: |
          revision=$(git ls-remote https://github.com/LMCache/LMCache.git refs/heads/dev | cut -f1)
          test -n "$revision"
          echo "LMCACHE_REF=$revision" >> "$GITHUB_ENV"
          mkdir -p "$E2E_ARTIFACTS"
          echo "$revision" | tee "$E2E_ARTIFACTS/lmcache-revision.txt"
          git rev-parse HEAD > "$E2E_ARTIFACTS/plugins-revision.txt"

      - name: Build CPU LMCache and install plugin
        run: |
          docker compose build test
          docker compose run --rm --no-deps test cat /opt/runtime-versions.txt \
            > "$E2E_ARTIFACTS/runtime-versions.txt"

      - name: Run real server round trip
        run: docker compose run --rm test

      - name: Collect cluster logs
        if: always()
        run: |
          mkdir -p "$E2E_ARTIFACTS"
          docker compose logs --no-color > "$E2E_ARTIFACTS/autumn.log" 2>&1
          docker compose ps -a > "$E2E_ARTIFACTS/compose-status.txt"

      - name: Stop cluster and remove test volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: autumn-server-e2e
          path: e2e-artifacts/
