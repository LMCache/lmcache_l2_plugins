name: Tests

on:
  schedule:
    # 02:17 Asia/Shanghai every day (18:17 UTC).
    - cron: "17 18 * * *"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  release:
    types: [published]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout tested revision
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          # Use the event revision: PR merge, nightly default branch, release tag,
          # or the branch/tag selected for manual dispatch.
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Verify installed plugins
        run: python -m build_support.verify_package .
