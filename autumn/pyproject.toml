[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmcache-autumn"
version = "0.1.0"
description = "LMCache L2 adapter plugin for autumn-rs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "lmcache>=0.5.7",
    "autumn-rs>=0.1.2",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
homepage = "https://github.com/LMCache/lmcache_l2_plugins/tree/main/autumn"
autumn-rs = "https://github.com/journeymidnight/autumn-rs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lmcache_autumn*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# The rules LMCache itself enforces.
select = ["E", "F", "B", "G004", "PLE1205"]

[tool.isort]
# Same as LMCache's .isort.cfg.
profile = "black"
from_first = true
import_heading_future = "Future"
import_heading_stdlib = "Standard"
import_heading_thirdparty = "Third Party"
import_heading_firstparty = "First Party"
import_heading_localfolder = "Local"
known_first_party = ["lmcache_autumn"]
known_third_party = ["autumn", "lmcache"]
