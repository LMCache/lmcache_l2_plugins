# Shared test runner. Add a vendor overlay from tests/<plugin>/e2e/compose.yaml.
services:
  test:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
      args:
        LMCACHE_REF: ${LMCACHE_REF:-dev}
    environment:
      LMCACHE_TRACK_USAGE: "false"
      DO_NOT_TRACK: "1"
    volumes:
      - ${E2E_ARTIFACTS:-./artifacts}:/artifacts
    profiles: [test]
