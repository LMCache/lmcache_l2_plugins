# Shared test runner. Add a vendor overlay from .buildkite/k3_tests/<plugin>/compose.yaml.
services:
  test:
    build:
      context: ../../..
      dockerfile: .buildkite/k3_tests/common_scripts/Dockerfile
      args:
        LMCACHE_REF: ${LMCACHE_REF:-dev}
    environment:
      LMCACHE_TRACK_USAGE: "false"
      DO_NOT_TRACK: "1"
    volumes:
      - ${E2E_ARTIFACTS:-../../../e2e-artifacts}:/artifacts
    profiles: [test]
